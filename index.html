
<!doctype html>
<html lang="ja" dir="ltr">
  <head>
     <title>F69's IDE v1.0.0</title>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width">
     <meta name="description" content="A simple Fjalu/Fjala Engine equipped HTML IDE">
     <meta name="robots" content="index">
     <meta name="theme-color" content="#FFFFFF">
     <meta property="og:title" content="F69's IDE v1.0.0">
     <meta property="og:description" content="A simple Fjalu/Fjala Engine equipped HTML IDE. Experience the next generation of typing!">
     <meta property="og:image" content="https://f69-js.github.io/FIDE/images/ex.png">
     <meta name="twitter:card" content="summary_large_image">
     <meta name="keywords" content="F69,F69-js,FIDE,Editor,IDE,Notepad,HTML,F69's IDE,メモ帳,開発環境,統合開発環境">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
     <link rel="apple-touch-icon" href="images/favicon.ico">
     <style id="theme_area">
        :root{
         --cursol-color:#000000;
         --line-no-color:#a9a4a2;
         --line-no-border:#4e4240;
         --main-color:#8d8584;
         --ineditor-text-color:#000000;
         --background-unit-color:#FFFFFF;
         --out-unit-color:#0000000;
       }
     </style>
     <style>
       @keyframes blink{
            50% {
                opacity: 0;
            }
       }
       #input>*{
         white-space:pre;
       }
       .group{
         margin:0px 0px;
         display:flex;
         flex-direction:row;
         min-height:20px;
         max-height:40px;
         overflow:hidden;
       }
      .line{
        font-size:16px;
        margin: auto 3px;
        font-size:20px;
      }
      .cursol{
        margin:15px 0px;
        border-bottom:3px solid var(--cursol-color);
        height:10px;
        width:10px;
        animation:1s blink infinite;
      }
      .lineno{
        background-color:var(--line-no-color);
        color:var(--ineditor-text-color);
        width:30px;
        height:40px;
        text-align:center;
        font-size:20px;
        border-top:2px solid var(--line-no-border);
        border-bottom:2px solid var(--line-no-border);
      }
      #maincontainer{
        background-color:var(--main-color);
        color:var(--out-unit-color);
      }
      #menu{
        display:flex;
        flex-direction:column;
      }
      #headermenu{
        display:flex;
        flex-direction:row;
        margin:0;
      }
      #showraw{
        max-width:64px;
        height:48px;
      }
      #filename{
        margin:0px 0px;
      }
      #body>*{
        background-color:var(--background-unit-color);
        color:var(--out-unit-color);
      }
     </style>
  </head>
  <body id=body>
    <div id=headermenu>
      <a href="https://github.com/F69-js/FIDE-F69s-IDE/">github</a>
       <button id=openfile>Open File</button>
       <button id=savefile>Save File</button>
  　　  <button id=settings>Open Settings</button>
   </div>
   <div id=middlearea>
     <input id=filenamei placeholder="Enter File Name...">
   </div>
    <div id=maincontainer>
       <div id=input>
  　　　    <div id=lineGroup0 class="group">
              <div id=lineno0 class=lineno>1</div>
              <div id=line0 class="line"></div>
              <div id=cursol0 class=cursol></div>
           </div>
       </div>
    </div>
    <div id=settingscontainer>
      <h1>Settings</h1>
      <p>theme:</p>
      <label for="maintheme">テーマ選択:</label>
      <select id=maintheme>
        <option value="l">light</option>
        <option value="d">dark</option>
      </select>
    </div>
    <div id=menu>
       <div id=error></div>
       <button id=showraw>raw</button>
    </div>
    <script src="./scripts/index.js" type="module"></script>
  </body>
</html>
