<style>
<style id="theme_area">
    :root {
      --cursor-color: #000000;
      --line-no-color: #a9a4a2;
      --line-no-border: #4e4240;
      --main-color: #8d8584;
      --ineditor-text-color: #1a1a1a;
      --background-unit-color: #FFFFFF;
      --out-unit-color: #1a1a1a;
      --header-color: #161616;
      --button-text-color: #FFFFFF; /* 暗い背景用の白文字 */
    }
</style>
<style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #input > * {
      white-space: pre;
    }

    .group {
      margin: 0;
      display: flex;
      flex-direction: row;
      min-height: 20px;
      max-height: 40px;
      overflow: hidden;
    }

    .line {
      margin: auto 3px;
      font-size: 20px;
    }

    .cursor {
      margin: 15px 0px;
      border-bottom: 3px solid var(--cursor-color);
      height: 10px;
      width: 10px;
      animation: 1s blink infinite;
    }

    .linenum {
      background-color: var(--line-no-color);
      color: var(--ineditor-text-color);
      width: 40px;
      height: 40px;
      text-align: center;
      font-size: 20px;
      border-top: 2px solid var(--line-no-border);
      border-bottom: 2px solid var(--line-no-border);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #maincontainer {
      background-color: var(--main-color);
      color: var(--out-unit-color);
      padding: 10px;
    }

    #menu {
      display: flex;
      flex-direction: column;
    }

    #headermenu {
      display: flex;
      flex-direction: row;
      align-items: center;
      margin: 0;
      padding: 5px 10px;
      background-color: var(--header-color) !important;
    }

    #showraw {
      max-width: 64px;
      height: 48px;
    }

    #filename {
      margin: 0;
    }

    #body > * {
      background-color: var(--background-unit-color);
      color: var(--out-unit-color);
    }

    .found {
      background-color: #FFFF00;
    }

    #middlearea {
      display: flex;
      flex-direction: column;
    }

    .inline {
      list-style-type: circle;
      margin: 0 20px;
    }

    code {
      background-color: #e9f3f5;
      border: 3px solid #d9e7e8;
      border-radius: 4px;
      padding: 2px 6px;
    }


        /* =========================================================
       📚 1. TIDE解析結果テーブル（サイト内ダークモード対応・文字色黒固定）
       ========================================================= */
    table, 
    table * {
      /* 💡 サイト内設定でダークモードにしても、テーブル内すべての要素の文字色を「黒」に強制固定！ */
      color: #000000 !important; 
    }

    table {
      border: 1px solid black;
      background-color: #d0fff8;
      min-width: 256px;
      margin: 10px;
      border-collapse: collapse;
    }

    tr {
      border: 1px solid black;
      background-color: #d0fff8;
    }

    td:not(.error) {
      border: 1px solid black;
      padding: 6px 10px;
    }

    tr:nth-child(odd):not(.error) { background-color: #d8fbff; }
    tr:nth-child(even):not(.error) { background-color: #bbf8ff; }

    /* 💡 エラー行（赤背景 ＆ 文字色黒固定） */
    .error, tr.error td {
      background-color: #ffa5a5 !important;
      color: #000000 !important;
    }
    
    /* 💡 警告行（マイルドな黄色背景 ＆ 文字色黒固定） */
    .warning, tr.warning td {
      background-color: #ffe6a5 !important;
      color: #000000 !important;
    }

    s {
      color: red !important; /* 打ち消し線はダークモードでも絶対「赤」で見せる */
      font-weight: bold;
    }

    caption {
      border: 1px solid black;
      background-color: #d0fff8;
      padding: 6px;
      font-weight: bold;
    }

    /* 💡 コード行番号への波線エフェクト（エラー＝赤、警告＝オレンジ） */
    .haserror {
      text-decoration-style: wavy; 
    }
    #textreplacer {
      background-color: var(--line-no-color);
      color: var(--ineditor-text-color) !important;
      height: 34px !important; /* 💡 高さを34pxに強制固定 */
      
      /* 💡 外枠の線をしっかり3pxで統一。ただし右側だけを点線（dashed）にする */
      border: 3px solid var(--line-no-border) !important;
      border-right: 3px dashed var(--line-no-border) !important;
      
      align-items: center;
      display: flex;
      width: 100px;
      justify-content: center;
      margin-left: 10px;
      box-sizing: border-box !important;
      border-radius: 4px 0px 0px 4px !important; /* 💡 左側の角だけを丸くする */
    }

    #replt {
      background-color: var(--line-no-color) !important;
      color: var(--ineditor-text-color) !important;
      height: 34px !important; /* 💡 左のラベルと高さを完全に1ピクセル単位で一致させる */
      font-size: 16px;
      padding: 4px 8px;
      
      /* 💡 犯人を逮捕：共通設定の border や border-radius を !important で完全に上書き拒否！ */
      border: 3px solid var(--line-no-border) !important;
      border-left: none !important; /* 💡 左側のボーダーは絶対に無し（0px）にして、点線と完全合体！ */
      
      /* 💡 犯人を逮捕：左側の角丸を「0」にして直線にし、右側の角だけを優しく丸くする！ */
      border-radius: 0px 4px 4px 0px !important; 
      
      box-sizing: border-box !important; /* 💡 高さが狂うのを100%安全に防御 */
      display: flex;
      align-items: center;
    }

    /* =========================================================
       🛠️ 2. ヘッダーメニュー・リンクレイアウト
       ========================================================= */
    #headermenu > main > button {
      background-color: transparent;
      border: none;
      color: var(--button-text-color);
      font-size: 20px;
      font-weight: bold;
      border-radius: 0px;
      min-width: 100px;
      max-width: none;
      cursor: pointer;
    }
    
    #headermenu > main > a {
      background-color: transparent;
      color: #cfedfe;
      margin-left: 10px;
      font-weight: bold;
      text-decoration: none;
      font-size: 20px;
    }
    #headermenu > main > a:visited {
      background-color: transparent;
      color: #85ff81;
      margin-left: 10px;
      font-weight: bold;
      text-decoration: underline;
      font-size: 20px;
    }
    /* 💡 改善：ホバー時のプルプル振動ジャンプバグを廃止し、スマートな色変化に変更 */
    #headermenu > main > a:hover {
      background-color: transparent;
      color: #81ffe7;
      text-decoration: none;
    }

    /* =========================================================
       フォーム・ツールバー・各種操作ボタン
       ========================================================= */
    html {
      margin: 0;
      height: 100vh;
      background-color: var(--background-unit-color);
    }

    #toolbars {
      display: flex;
      flex-wrap: wrap;
      padding: 5px;
    }

    #toolbar,
    .imgcontainer {
      display: flex;
      flex-direction: column;
    }

    button,
    input#filenamei {
      padding: 10px;
      margin: 4px;
      border-radius: 4px;
    }

    #openfile,
    #savefile,
    #settings,
    #pencolor {
      min-width: 48px;
      min-height: 48px;
    }
    
    #filenamei {
      font-size: 17px;
      background-color: var(--line-no-color);
      width: 200px;
      border: 1px solid var(--line-no-border);
      color: #000000 !important;
    }

    /* メインの操作用ボタン（背景が暗いため、文字は確実に白にする） */
    button {
      background-color: var(--line-no-border);
      border: 1px solid var(--line-no-color);
      min-width: 110px;
      height: 50px;
      overflow: hidden;
      color: var(--button-text-color) !important;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    
    #palettecolor {
      background-color: var(--line-no-border);
      border: 1px solid;
      width: 48px;
      height: 48px;
    }
    #setc {
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #toolbars > span, #toolbars > label {
      align-items: center;
      display: flex;
      margin-right: 5px;
    }
    #spanc {
      margin-left: 20px;
    }
    
    hr {
      background-color: var(--cursor-color) !important;
      border: none !important;
      height: 2px !important;
    }
    #replacco {
      background: transparent;
      border: none;
      font-size: 15px;    
    }

    /* 検索・置換の入力ボックス（文字が白化して消滅するのを黒固定で防御） */
    #searchg > input, #replg > input {
      background-color: var(--line-no-color);
      min-height: 32px;
      font-size: 16px;
      border: 1px solid var(--line-no-border);
      padding: 4px 8px;
      border-radius: 4px;
      color: #000000 !important;
    }

    input[type="checkbox"] {
      width: 32px;
      display: flex;
      align-items: center;
    }
    #searchg {
      display: flex;
      flex-direction: column;
    }
    #searchg > div {
      display: flex;
    }
    #textregexmode {
      display: flex;
      align-items: center;
      margin-right: 10px;
    }
    #searchi {
      max-height: 20px;
      display: flex;
      position: relative;
      top: 15px;
      margin-left: 10px;
      margin-right: 20px;
    }
    #replg {
      align-items: center;
    }
    #textreplacer {
      background-color: var(--line-no-color);
      min-height: 34px;
      border: 3px solid var(--line-no-border);
      align-items: center;
      display: flex;
      width: 100px;
      justify-content: center;
      margin-left: 10px;
      border-right: 3px dashed var(--line-no-border);
    }
    #replt {
      border: 3px solid var(--line-no-border);
      border-left: none;
    }
</style>
