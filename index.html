<!doctype html>
<html lang="ja" dir="ltr">

<head>
  <title>F69's IDE v1.0.0</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="description" content="A simple Fjalu/Fjala Engine equipped HTML IDE">
  <meta name="robots" content="index">
  <meta name="theme-color" content="#FFFFFF">
  <meta property="og:title" content="F69's IDE v1.0.0">
  <meta property="og:description" content="A simple Fjalu/Fjala Engine equipped HTML IDE.">
  <meta property="og:image" content="https://f69-js.github.io/FIDE-F69s-IDE/images/ex2.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://f69-js.github.io/FIDE-F69s-IDE/">
  <meta name="twitter:title" content="F69's IDE v1.0.0">
  <meta name="twitter:description" content="A simple Fjalu/Fjala Engine equipped HTML IDE.">
  <meta name="keywords" content="F69,F69-js,FIDE,Editor,IDE,Notepad,HTML,F69's IDE,メモ帳,開発環境,統合開発環境">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <meta name="twitter:image" content="https://f69-js.github.io/FIDE-F69s-IDE/images/ex2.png">
  <link rel="apple-touch-icon" href="images/favicon.ico">
  <link rel="modulepreload" href="scripts/index.js">
  <link rel="modulepreload" href="scripts/fjalu/index.js">

<style id="theme_area">
    :root {
      --cursor-color: #000000;
      --line-no-color: #a9a4a2;
      --line-no-border: #4e4240;
      --main-color: #8d8584;
      --ineditor-text-color: #1a1a1a;
      --background-unit-color: #FFFFFF;
      --out-unit-color: #1a1a1a;
      --header-color: #161616;
      --button-text-color: #FFFFFF;
    }
</style>
<style>
    body {
      margin: 0;
      padding: 0;
      font-family: inherit;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    #input > * {
      white-space: pre;
    }

    /* 各行の横並びコンテナ */
    .group {
      margin: 0px 0px;
      display: flex;
      flex-direction: row;
      min-height: 40px;
      max-height: 40px;
      overflow: hidden;
    }

    /* エディタ内のテキスト（美しい等幅フォントと完璧な行間） */
    .line {
      font-size: 20px;
      margin: auto 3px;
      line-height: 40px !important; 
      height: 40px;
      display: inline-block;
    }

    /* 💡 1番目の赤丸（マークダウンのブラケット等への下線・波線誤爆）を最上流で完全防御 */
    #input * {
      text-decoration: none !important;
    }

    /* 🎯 2番目・3番目の赤丸：あなたのオリジナルの行番号スタイル（セレクタのスペルミスを完全修正！） */
    .lineno {
      background-color: var(--line-no-color); /* あえてねずみ色にして見やすさを極限まで高める */
      color: var(--ineditor-text-color);
      width: 30px; /* カチッと30pxの幅に固定して、右のテキストを押し出さない */
      height: 40px;
      text-align: center; /* 数字を美しく中央揃えにする */
      font-size: 20px;
      
      /* 上下に2pxの美しい境界線を配置して、行ごとの視認性を100%確保する */
      border-top: 2px solid var(--line-no-border);
      border-bottom: 2px solid var(--line-no-border);
      
      box-sizing: border-box; 
      display: inline-block;
      line-height: 36px; /* 境界線の4px分を引いた高さで数字を上下中央にアライン */
      cursor: pointer;
    }

    #maincontainer {
      background-color: var(--main-color);
      color: var(--out-unit-color);
    }

    #menu {
      display: flex;
      flex-direction: column;
    }

    #headermenu {
      display: flex;
      flex-direction: row;
      align-items: center;
      margin: 0;
      background-color: var(--header-color) !important;
    }

    #showraw {
      max-width: 64px;
      height: 48px;
    }

    #filename {
      margin: 0px 0px;
    }

    #body > * {
      background-color: var(--background-unit-color);
      color: var(--out-unit-color);
    }

    .found {
      background-color: #FFFF00;
    }

    #middlearea {
      display: flex;
      flex-direction: column;
    }

    .inline {
      list-style-type: circle;
      margin: 0px 20px;
    }

    code {
      background-color: #e9f3f5;
      border: 3px solid #d9e7e8;
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* =========================================================
       🛡️ TIDE解析結果テーブル（文字白化・ダークモードバグ完全ガード）
       ========================================================= */
    table, 
    table * {
      /* サイト内設定をダークモードに切り替えても、テーブル内の文字色を絶対に「黒」で固定！ */
      color: #000000 !important; 
    }

    table {
      border: 1px solid black;
      background-color: #d0fff8;
      min-width: 256px;
      color: var(--cursor-color);
      margin: 10px;
      border-collapse: collapse;
    }

    tr {
      border: 1px solid black;
      background-color: #d0fff8;
    }

    td:not(.error) {
      border: 1px solid black;
      padding: 6px 10px;
    }

    tr:nth-child(odd):not(.error) {
      background-color: #d8fbff;
    }

    tr:nth-child(even):not(.error) {
      background-color: #bbf8ff;
    }

    /* エラー行（赤背景） */
    .error, tr.error td {
      background-color: #ffa5a5 !important;
      color: #000000 !important;
    }
    
    /* 警告行（マイルドな黄色背景） */
    .warning, tr.warning td {
      background-color: #ffe6a5 !important;
      color: #000000 !important;
    }

    s {
      color: red !important;
      font-weight: bold;
    }

    caption {
      border: 1px solid black;
      background-color: #d0fff8;
      padding: 6px;
      font-weight: bold;
    }

    /* 行番号への波線エフェクト（赤＝エラー、オレンジ＝警告） */
    .haserror {
      text-decoration-style: wavy;
      text-decoration-line: underline;
      text-decoration-color: red;
    }
    
    .haswarning {
      text-decoration-style: wavy;
      text-decoration-line: underline;
      text-decoration-color: #ff9900;
    }

    /* =========================================================
       ヘッダーメニューリンク
       ========================================================= */
    #headermenu > main > button {
      background-color: transparent;
      border: none;
      color: var(--button-text-color) !important;
      font-size: 20px;
      font-weight: bold;
      border-radius: 0px;
      min-width: 100px;
      max-width: none;
      cursor: pointer;
    }

    #headermenu > main > a {
      background-color: transparent;
      color: #cfedfe;
      margin-left: 10px;
      font-weight: bold;
      text-decoration: none;
      font-size: 20px;
    }

    #headermenu > main > a:visited {
      background-color: transparent;
      color: #85ff81;
      margin-left: 10px;
      font-weight: bold;
      text-decoration: underline;
      font-size: 20px;
    }

    /* ホバー時の振動ガタつきバグをスマートに消去 */
    #headermenu > main > a:hover {
      background-color: transparent;
      color: #81ffe7;
      text-decoration: none;
    }

    /* =========================================================
       各種フォーム・操作用ボタン
       ========================================================= */
    html {
      margin: 0;
      height: 100vh;
      background-color: var(--background-unit-color);
    }
    
    #filenamei {
      font-size: 17px;
      background-color: var(--line-no-color);
      width: 200px;
      color: #000000 !important;
    }

    button {
      background-color: var(--line-no-border);
      border: 1px solid var(--line-no-color);
      min-width: 100px;
      max-width: 101px;
      height: 60px;
      overflow: hidden;
      color: var(--button-text-color) !important;
      font-size: 20px;
      cursor: pointer;
    }

    #toolbars {
      display: flex;
    }

    #toolbar,
    .imgcontainer {
      display: flex;
      flex-direction: column;
    }

    button,
    input#filenamei {
      padding: 12px;
      margin: 4px;
    }

    #openfile,
    #savefile,
    #settings,
    #pencolor {
      min-width: 48px;
      min-height: 48px;
    }

    #palettecolor {
      background-color: var(--line-no-border);
      border: 1px solid;
      width: 48px;
      height: 48px;
    }

    #setc {
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #toolbars > span, #toolbars > label {
      align-items: center;
      display: flex;
      margin-right: 5px;
    }

    #spanc {
      margin-left: 20px;
    }

    hr {
      background-color: var(--cursor-color) !important;
      border: none !important;
      height: 2px !important;
    }

    /* =========================================================
       🔄 検索・置換ボックス（右側の「隙間ゼロ・境界線一体化」を完全再現）
       ========================================================= */
    #replacco {
      background: transparent;
      border: none;
      font-size: 15px;    
    }

    #searchg > input, #replg > input {
      background-color: var(--line-no-color);
      min-height: 32px;
      font-size: 16px;
      color: #000000 !important;
    }

    input[type="checkbox"] {
      width: 32px;
      display: flex;
      align-items: center;
    }

    #searchg {
      display: flex;
      flex-direction: column;
    }

    #searchg[hidden] {
      display: none !important;
    }

    #searchg > div {
      display: flex;
    }

    #textregexmode {
      display: flex;
      align-items: center;
      margin-right: 10px;
    }

    #searchi {
      max-height: 20px;
      display: flex;
      position: relative;
      top: 15px;
      margin-left: 10px;
      margin-right: 20px;
    }

    #replg {
      align-items: center;
      display: flex;
      border: 3px solid var(--line-no-border) !important;
      border-left: none !important;
      border-radius: 0px 4px 4px 0px !important;
      box-sizing: border-box;
      height: 34px;
    }

    #replg[hidden] {
      display: none !important;
    }

    #textreplacer {
      background-color: var(--line-no-color);
      min-height: 34px;
      border: 3px solid var(--line-no-border);
      align-items: center;
      display: flex;
      width: 100px;
      justify-content: center;
      margin-left: 10px;
      border-right: 3px dashed var(--line-no-border) !important;
      border-radius: 4px 0px 0px 4px !important;
      box-sizing: border-box;
    }

    #replt {
      border: 3px solid var(--line-no-border) !important;
      border-left: none !important;
      border-radius: 0px 4px 4px 0px !important;
      box-sizing: border-box;
      height: 34px;
    }
    hr {
      background-color: var(--main-color) !important; 
      border: none !important;
      height: 2px !important;
    }
    .cursol {
      margin: 15px 0px;
      border-bottom: 3px solid var(--cursor-color) !important;
      height: 10px !important;
      width: 10px !important;
      display: inline-block;
    }
</style>
</head>

<body id=body>
  <div id=headermenu>
    <main>
      <a href="https://github.com/F69-js/FIDE-F69s-IDE/">github</a>
      <button id=openfile>Open File</button>
      <button id=savefile>Save File</button>
      <button id=settings>Open Settings</button>
  </div>
  <div id=middlearea>
    <input id=filenamei placeholder="Enter File Name...">
    <div id="searchg" hidden>
      <div>
        <input id="searchi" placeholder="fox">
        <span id="textregexmode">正規表現モード</span>
        <input type="checkbox" id="rgxmode">
        <div id="flagg" hidden="">
          <span id="textflag">フラグ 複数の場合は,を使用してください</span>
          <input id="flags" placeholder="g,m,u">
        </div>
        <button id="replacco">▶</button>
      </div>
      <div id="replg">
        <span id="textreplacer">置換先</span>
        <input id="replt" placeholder="cat">
      </div>
    </div>
  </div>
  <div id=searchresults></div>
  <hr>
  <div id=toolbars>
    <span id=spanc></span>
    <label for="palettecolor">パレット色選択</label>
    <input type=color id=palettecolor>
    <button id=setc>push</button>
  </div>
  <hr>
  <div id=maincontainer>
    <div id=input>
        <div id=lineGroup0 class="group">
           <div id=lineno0 class=lineno>1</div>
           <div id=line0 class="line"></div>
           <div id=cursol0 class=cursol></div>
        </div>
    </div>
  </div>
  <hr>
  <div id=info>
    <table>
      <caption>vars</caption>
      <tbody id=variables></tbody>
    </table>
  </div>
  <div id=imgcontainer>
    <div id=mediamenu>
      <button id=penmode>ペン</button>
      <label for="pencolor">ペンの色を選択</label>
      <div id=tpcolor>ペンの色</div>
      <input type=color id=pencolor>
    </div>
    <canvas id=img1></canvas>
  </div>
  <div id=settingscontainer>
    <h1>Settings</h1>
    <p>theme:</p>
    <label for="maintheme" id="ttl1"></label>
    <select id=maintheme>
      <option value="l">light</option>
      <option value="d">dark</option>
    </select>
    <label for="unloaden" id="tul1"></label>
    <input type=checkbox id="unl">
    <p id="tul2"></p>
  </div>
  <div id=menu>
    <div id=error></div>
    <button id=showraw>raw</button>
    <button id=rawexec>Exec</button>
  </div>
  <script src="./scripts/index.js" type="module" defer></script>
  </main>
</body>

</html>
